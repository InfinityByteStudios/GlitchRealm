name: Performance Budget

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  performance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build site
        run: npm run build

      - name: Run Lighthouse CI
        run: ./node_modules/.bin/lhci autorun --config=config/lighthouserc.json

      - name: Upload performance reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 30

      - name: Lint
        # Advisory only: the repo has pre-existing lint debt (85 errors), so a
        # red lint job would mask real regressions in CI.
        continue-on-error: true
        env:
          ESLINT_USE_FLAT_CONFIG: 'false'
        run: ./node_modules/.bin/eslint js scripts --ext .js,.mjs --config config/.eslintrc.json
